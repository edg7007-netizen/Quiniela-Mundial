name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quiniela_mundial
          POSTGRES_USER: quiniela
          POSTGRES_PASSWORD: quiniela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiniela -d quiniela_mundial"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/quiniela_mundial
          SPRING_DATASOURCE_USERNAME: quiniela
          SPRING_DATASOURCE_PASSWORD: quiniela
          SPRING_DOCKER_COMPOSE_ENABLED: false
        run: ./gradlew --no-daemon clean test build
