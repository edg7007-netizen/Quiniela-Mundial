<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content" class="mx-auto max-w-md rounded-[2rem] border border-white/10 bg-white/[0.05] p-6 shadow-glow md:p-8">
    <p class="text-xs uppercase tracking-[0.25em] text-slate-500">Alta de usuario</p>
    <h1 class="mt-2 text-3xl font-black tracking-tight text-white">Crear cuenta</h1>
    <p class="mt-2 text-sm leading-6 text-slate-300">Únete a la quiniela y empieza a sumar puntos desde el primer cruce.</p>
    <p class="mt-5 rounded-2xl border border-red-400/30 bg-red-400/10 px-4 py-3 text-sm text-red-100" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form method="post" th:action="@{/register}" th:object="${registerForm}" class="mt-6 space-y-4">
        <input class="w-full rounded-2xl border border-white/10 bg-white/[0.05] px-4 py-3 text-white placeholder:text-slate-500 outline-none transition focus:border-emerald-300/50" type="text" th:field="*{name}" placeholder="Nombre" required>
        <input class="w-full rounded-2xl border border-white/10 bg-white/[0.05] px-4 py-3 text-white placeholder:text-slate-500 outline-none transition focus:border-emerald-300/50" type="email" th:field="*{email}" placeholder="Correo" required>
        <input class="w-full rounded-2xl border border-white/10 bg-white/[0.05] px-4 py-3 text-white placeholder:text-slate-500 outline-none transition focus:border-emerald-300/50" type="password" th:field="*{password}" placeholder="Contraseña" required>
        <button class="w-full rounded-full bg-emerald-400 py-3 font-semibold text-slate-950 transition hover:bg-emerald-300" type="submit">Registrarme</button>
    </form>
</section>
</html>
