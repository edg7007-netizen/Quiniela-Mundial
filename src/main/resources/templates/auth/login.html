<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content" class="max-w-md mx-auto">
    <article class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-2xl">Iniciar sesión</h1>
            <div th:if="${param.error}" class="alert alert-error">Correo o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-info">Has cerrado sesión correctamente.</div>
            <div th:if="${param.registered}" class="alert alert-success">Registro exitoso. Ahora puedes iniciar sesión.</div>
            <form method="post" th:action="@{/login}" class="space-y-3">
                <label class="form-control w-full">
                    <span class="label-text mb-1">Correo</span>
                    <input class="input input-bordered w-full" type="email" name="username" placeholder="correo@ejemplo.com" required>
                </label>
                <label class="form-control w-full">
                    <span class="label-text mb-1">Contraseña</span>
                    <input class="input input-bordered w-full" type="password" name="password" placeholder="••••••••" required>
                </label>
                <button class="btn btn-primary w-full" type="submit">Ingresar</button>
            </form>
            <a class="btn btn-outline w-full" href="/oauth2/authorization/google">Ingresar con Google</a>
            <p class="text-sm text-center">¿No tienes cuenta? <a class="link link-primary" href="/register">Regístrate</a></p>
        </div>
    </article>
</section>
</html>
