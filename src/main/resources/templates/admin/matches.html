<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content">
    <h1 class="text-2xl font-bold mb-4">Administración de partidos</h1>
    <div class="grid gap-3">
        <article th:each="match : ${matches}" class="bg-white rounded shadow p-4">
            <p class="font-semibold" th:text="${match.homeTeam.name + ' vs ' + match.awayTeam.name}"></p>
            <form class="mt-2 flex items-center gap-2" th:action="@{'/admin/matches/' + ${match.id} + '/result'}" method="post">
                <input type="number" min="0" name="homeScore" class="border rounded p-1 w-16" required>
                <span>-</span>
                <input type="number" min="0" name="awayScore" class="border rounded p-1 w-16" required>
                <button class="bg-slate-900 text-white px-3 py-1 rounded" type="submit">Guardar resultado</button>
            </form>
        </article>
    </div>
</section>
</html>
