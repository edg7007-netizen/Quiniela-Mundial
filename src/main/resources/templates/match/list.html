<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content">
    <h1 class="text-2xl font-bold mb-4">Partidos</h1>
    <div class="grid gap-3">
        <a th:each="match : ${matches}" th:href="@{'/matches/' + ${match.id}}" class="bg-white rounded shadow p-4 block hover:bg-emerald-50">
            <p class="font-semibold" th:text="${match.homeTeam.name + ' vs ' + match.awayTeam.name}"></p>
            <p class="text-sm text-gray-600" th:text="${match.phase + ' · ' + #temporals.format(match.startTime, 'yyyy-MM-dd HH:mm')} "></p>
        </a>
    </div>
</section>
</html>
