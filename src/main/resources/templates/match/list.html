<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content" class="space-y-4">
    <h1 class="text-3xl font-bold">Partidos</h1>
    <div class="grid gap-4">
        <a th:each="match : ${matches}" th:href="@{'/matches/' + ${match.id}}" class="card bg-base-100 shadow hover:shadow-xl transition-shadow block">
            <div class="card-body">
                <div class="flex items-center justify-between gap-3 flex-wrap">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="avatar">
                            <div class="w-10 rounded-full bg-base-200">
                                <img th:src="${match.homeTeam.flagUrl != null ? match.homeTeam.flagUrl : 'https://countryflagsapi.netlify.app/flag/' + match.homeTeam.fifaCode + '.svg'}" th:alt="${'Bandera de ' + match.homeTeam.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';">
                                <span class="flag-fallback w-10 h-10 items-center justify-center text-lg">🏳️</span>
                            </div>
                        </div>
                        <p class="font-semibold truncate" th:text="${match.homeTeam.name}"></p>
                    </div>
                    <span class="badge badge-accent badge-lg">VS</span>
                    <div class="flex items-center gap-3 min-w-0">
                        <p class="font-semibold truncate" th:text="${match.awayTeam.name}"></p>
                        <div class="avatar">
                            <div class="w-10 rounded-full bg-base-200">
                                <img th:src="${match.awayTeam.flagUrl != null ? match.awayTeam.flagUrl : 'https://countryflagsapi.netlify.app/flag/' + match.awayTeam.fifaCode + '.svg'}" th:alt="${'Bandera de ' + match.awayTeam.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';">
                                <span class="flag-fallback w-10 h-10 items-center justify-center text-lg">🏳️</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 text-sm">
                    <span class="badge badge-primary" th:text="${match.phase.label}"></span>
                    <span class="badge badge-outline" th:text="${match.status.label}"></span>
                    <span class="badge badge-ghost" th:text="${#temporals.format(match.startTime, 'yyyy-MM-dd HH:mm')}"></span>
                    <span class="badge badge-ghost" th:text="${match.venue}"></span>
                </div>
            </div>
        </a>
    </div>
</section>
</html>
