<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content" class="bg-white rounded shadow p-6">
    <h1 class="text-2xl font-bold mb-2" th:text="${match.homeTeam.name + ' vs ' + match.awayTeam.name}"></h1>
    <p class="text-gray-600 mb-4" th:text="${#temporals.format(match.startTime, 'yyyy-MM-dd HH:mm') + ' · ' + match.venue}"></p>
    <div th:replace="~{fragments/predictionForm :: predictionForm(matchId=${match.id})}"></div>
</section>
</html>
