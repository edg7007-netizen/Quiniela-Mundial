<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Quiniela Mundial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stadium: {
                            950: '#04111f',
                            900: '#081a2f',
                            800: '#0d2441'
                        },
                        neon: {
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669'
                        }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(52,211,153,.14), 0 18px 45px rgba(4,17,31,.35)'
                    }
                }
            }
        };
    </script>
    <script>
        document.addEventListener('htmx:configRequest', function (event) {
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            if (token && header) {
                event.detail.headers[header] = token;
            }
        });
    </script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.18),_transparent_35%),linear-gradient(180deg,_#08111f_0%,_#040b16_60%,_#02060d_100%)] text-slate-100 flex flex-col">
<div class="absolute inset-x-0 top-0 -z-10 h-[32rem] bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.18),_transparent_42%)]"></div>
<nav class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/80 backdrop-blur-xl" x-data="{ open: false }">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-5 md:px-6">
        <a href="/" class="flex items-center gap-3">
            <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-emerald-400/30 bg-emerald-400/10 text-emerald-300 shadow-glow">QM</span>
            <span>
                <span class="block text-xs uppercase tracking-[0.35em] text-sky-200/70">FIFA 2026</span>
                <span class="block text-base font-semibold text-white">Quiniela Mundial</span>
            </span>
        </a>
        <button class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm md:hidden" @click="open = !open">Menú</button>
        <div class="hidden items-center gap-3 text-sm md:flex">
            <a class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/5 hover:text-white" href="/">Inicio</a>
            <a class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/5 hover:text-white" href="/matches">Partidos</a>
            <a class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/5 hover:text-white" href="/leaderboard">Clasificación</a>
            <a class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/5 hover:text-white" href="/predictions/history">Mis pronósticos</a>
            <a class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/5 hover:text-white" href="/admin/matches" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="rounded-full border border-white/10 px-4 py-2 text-white transition hover:border-emerald-400/50 hover:text-emerald-200" href="/login" sec:authorize="!isAuthenticated()">Ingresar</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="rounded-full bg-emerald-500 px-4 py-2 font-medium text-slate-950 transition hover:bg-emerald-400" type="submit">Salir</button>
            </form>
        </div>
    </div>
    <div class="border-t border-white/10 px-5 pb-5 md:hidden md:px-6" x-show="open" x-transition>
        <div class="mx-auto grid max-w-7xl gap-3 pt-5 text-sm">
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/">Inicio</a>
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/matches">Partidos</a>
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/leaderboard">Clasificación</a>
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/predictions/history">Mis pronósticos</a>
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/admin/matches" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3" href="/login" sec:authorize="!isAuthenticated()">Ingresar</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="w-full rounded-2xl bg-emerald-500 px-4 py-3 font-medium text-slate-950" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>

<main class="mx-auto flex-1 w-full max-w-7xl px-5 py-10 md:px-6 md:py-12 lg:py-14" layout:fragment="content"></main>

<footer class="mt-16 border-t border-white/10 bg-slate-950/70">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-8 text-sm text-slate-400 md:flex-row md:items-center md:justify-between md:px-6">
        <div>
            <p class="font-semibold text-slate-200">Quiniela Mundial FIFA 2026</p>
            <p>Pronósticos, clasificación en vivo y una experiencia inspirada en la noche mundialista.</p>
        </div>
        <p class="text-slate-500">Cada partido cuenta.</p>
    </div>
</footer>
</body>
</html>
