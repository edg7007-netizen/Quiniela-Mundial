<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<section layout:fragment="content" class="space-y-6">
    <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
        <div>
            <p class="text-xs uppercase tracking-[0.25em] text-slate-500">Ranking global</p>
            <h1 class="mt-2 text-4xl font-black tracking-tight text-white">Clasificación</h1>
            <p class="mt-2 max-w-2xl text-slate-300">Sigue la lucha por la cima y revisa quién está convirtiendo exactos en puntos grandes.</p>
        </div>
        <div class="rounded-3xl border border-white/10 bg-white/[0.04] px-5 py-4 text-sm text-slate-300">
            <p class="font-semibold text-white">Referencia de puntaje</p>
            <p>Exacto: 3 · Tendencia: 1</p>
        </div>
    </div>

    <div class="grid gap-4 md:grid-cols-3" th:if="${#lists.size(entries) >= 3}">
        <article th:each="entry : ${entries.subList(0, 3)}" class="rounded-[1.75rem] border p-5 shadow-glow"
                 th:classappend="${entry.rank == 1} ? ' border-amber-300/30 bg-amber-300/10' : (${entry.rank == 2} ? ' border-slate-200/20 bg-white/[0.05]' : ' border-orange-300/20 bg-orange-300/10')">
            <p class="text-xs uppercase tracking-[0.25em] text-slate-400" th:text="${entry.rank == 1 ? 'Líder' : 'Top ' + entry.rank}"></p>
            <p class="mt-4 text-2xl font-bold text-white" th:text="${entry.userName}"></p>
            <div class="mt-6 flex items-end justify-between">
                <p>
                    <span class="block text-4xl font-black text-white" th:text="${entry.totalPoints}"></span>
                    <span class="text-xs uppercase tracking-[0.25em] text-slate-500">Puntos</span>
                </p>
                <p class="text-right text-sm text-slate-300">
                    <span class="block font-semibold text-white" th:text="${entry.exactMatches}"></span>
                    <span>Exactos</span>
                </p>
            </div>
        </article>
    </div>

    <div class="overflow-hidden rounded-[1.75rem] border border-white/10 bg-white/[0.04] shadow-glow">
        <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm text-slate-300">
                <thead class="border-b border-white/10 bg-slate-950/60 text-xs uppercase tracking-[0.25em] text-slate-500">
                <tr>
                    <th class="px-4 py-4">Posición</th>
                    <th class="px-4 py-4">Usuario</th>
                    <th class="px-4 py-4">Puntos</th>
                    <th class="px-4 py-4">Exactos</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${entries}" class="border-t border-white/10 transition hover:bg-white/[0.03]">
                    <td class="px-4 py-4">
                        <span class="inline-flex h-10 w-10 items-center justify-center rounded-2xl border border-white/10 bg-slate-950/50 font-bold text-white" th:text="${entry.rank}"></span>
                    </td>
                    <td class="px-4 py-4 font-semibold text-white" th:text="${entry.userName}"></td>
                    <td class="px-4 py-4 text-lg font-bold text-white" th:text="${entry.totalPoints}"></td>
                    <td class="px-4 py-4" th:text="${entry.exactMatches}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(entries)}">
                    <td colspan="4" class="px-4 py-8 text-center text-slate-400">Todavía no hay datos para mostrar en la clasificación.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
