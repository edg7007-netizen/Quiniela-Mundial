<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-emerald-200/80">Pronóstico confirmado</p>
    <p class="mt-3 text-2xl font-bold" th:text="${prediction.homeScore + ' - ' + prediction.awayScore}"></p>

</div>
</html>
