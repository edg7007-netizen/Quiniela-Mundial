<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="predictionForm(matchId)" th:id="'prediction-form-' + ${matchId}">
    <form class="flex items-center gap-3 flex-wrap" hx-post="/predictions" th:attr="hx-target=${'#prediction-form-' + matchId}" hx-swap="outerHTML">
        <input type="hidden" name="matchId" th:value="${matchId}">
        <label class="input input-bordered flex items-center gap-2">
            <span class="text-sm">Local</span>
            <input type="number" name="homeScore" min="0" class="w-16" required>
        </label>
        <span class="font-bold">-</span>
        <label class="input input-bordered flex items-center gap-2">
            <span class="text-sm">Visitante</span>
            <input type="number" name="awayScore" min="0" class="w-16" required>
        </label>
        <button class="btn btn-primary" type="submit">Guardar pronóstico</button>
    </form>
</div>
</html>
